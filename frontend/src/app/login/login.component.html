<div class="login-wrapper">
    <!-- Left Side: Welcome & Branding -->
    <div class="welcome-side">
        <div class="brand-top-left">
            <img src="assets/logo.png" alt="Rasmi Logo" class="brand-logo">
            Rasmi
        </div>

        <div class="welcome-content">
            <h1>Bienvenue</h1>
            <p class="main-text">
                Votre plateforme universitaire tout-en-un pour une gestion simplifiée.
            </p>
            <p class="sub-text">
                Connectez-vous pour accéder à votre espace personnel et gérer vos activités en toute sérénité.
            </p>
        </div>
    </div>

    <!-- Right Side: Login Form -->
    <div class="login-side">
        <div class="login-card">
            <div class="form-header">
                <h2>Connexion</h2>
                <p>Heureux de vous revoir !</p>
            </div>

            <div class="login-form">
                <button type="button" class="btn-login" (click)="onLogin()">
                    <span>Accéder à l'accueil</span>
                </button>
            </div>
        </div>
    </div>
</div>
